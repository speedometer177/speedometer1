name: Generate Static Article Pages

on:
  repository_dispatch:
    types: [article-changed]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      articleId:
        description: 'מזהה כתבה ספציפית לרינדור מוקד (השאר ריק לרינדור מלא)'
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: generate-static-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run static generator script
        env:
          SUPABASE_URL: 'https://kaykrrnmykqrfhawgtqt.supabase.co'
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_ARTICLE_ID: ${{ github.event.client_payload.articleId || github.event.inputs.articleId }}
        run: npm run generate

      - name: Commit and push with retry on conflict
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # תיקון 16.11.2026: "git add article/*" לא רושם מחיקות, ולכן עמודים של כתבות ורכבים
          # שנמחקו נשארו באתר לתמיד (11 עמודים כאלה נמצאו). "git add -A" רושם גם מחיקות.
          # [ -d ... ] מגן מפני המקרה שבו התיקייה לא נוצרה כלל (תקלה זמנית מול סופרבייס).
          git add sitemap.xml sitemap-news.xml index.html 404.html cars-list.html usage-value-calculator.html
          # עמודי המדור (/review/, /local/ ...), עמודי המותג (/cars/) ועמודי ההשוואה (/compare/)
          for d in local world review electric tech buying sport luxury cars compare; do if [ -d "$d" ]; then git add -A "$d"; fi; done
          if [ -d article ]; then git add -A article; fi
          if [ -d car ]; then git add -A car; fi
          # בלם בטיחות: מחיקה של יותר מ-40 עמודים בריצה אחת היא כמעט בוודאות תקלה
          # (תשובה חלקית מהמאגר) ולא מחיקה אמיתית. במקרה כזה לא מפרסמים כלום.
          DELETED=$(git diff --cached --name-only --diff-filter=D -- article car | wc -l)
          if [ "$DELETED" -gt 40 ]; then
            echo "❌ $DELETED עמודים מסומנים למחיקה בריצה אחת - עוצרים בלי לפרסם."
            git diff --cached --name-only --diff-filter=D | head -50
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "🤖 אוטומציה: רענון דפים סטטיים ומפת אתר [skip ci]"

          # מנגנון retry: אם push נכשל בגלל מירוץ עם ריצה אחרת,
          # לא עושים rebase (הקבצים גנרטיביים - rebase נתקע על קונפליקט תוכן).
          # במקום: מתאפסים למצב העדכני ב-origin ומריצים את הגנרטור מחדש עליו.
          # התוצר הוא פונקציה טהורה של הדאטהבייס + התבנית, אז אין מה "למזג".
          for i in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✅ Push succeeded on attempt $i"
              exit 0
            fi
            echo "⚠️ Push failed (attempt $i) — resetting to latest origin and regenerating..."
            git rebase --abort 2>/dev/null || true
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            npm run generate
            git add sitemap.xml sitemap-news.xml index.html 404.html cars-list.html usage-value-calculator.html
            # עמודי המדור (/review/, /local/ ...), עמודי המותג (/cars/) ועמודי ההשוואה (/compare/)
            for d in local world review electric tech buying sport luxury cars compare; do if [ -d "$d" ]; then git add -A "$d"; fi; done
            if [ -d article ]; then git add -A article; fi
            if [ -d car ]; then git add -A car; fi
            DELETED=$(git diff --cached --name-only --diff-filter=D -- article car | wc -l)
            if [ "$DELETED" -gt 40 ]; then
              echo "❌ $DELETED עמודים מסומנים למחיקה בריצה אחת - עוצרים בלי לפרסם."
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "✅ Origin already up to date after regeneration — nothing to push."
              exit 0
            fi
            git commit -m "🤖 אוטומציה: רענון דפים סטטיים ומפת אתר [skip ci]"
            sleep $((i * 3))
          done
          echo "❌ Push failed after 5 attempts."
          exit 1

      - name: Notify IndexNow (push instant Google/Bing indexing)
        run: |
          # תיקון 16.11.2026: עד היום נשלחו כל כתובות האתר (מעל 300) בכל ריצה, כל 4 שעות.
          # שליחה חוזרת של כתובות שלא השתנו גורמת למנועי החיפוש להתעלם מהאות.
          # עכשיו נשלחות רק כתובות שעודכנו ביומיים האחרונים (לפי lastmod) וכתובות של עמודים שנמחקו.
          URLS=$(python3 - <<'PYEOF'
          import re, json, os, subprocess, datetime
          cut = (datetime.date.today() - datetime.timedelta(days=1)).isoformat()
          xml = open('sitemap.xml', encoding='utf-8').read()
          urls = [loc for loc, mod in re.findall(r'<loc>([^<]+)</loc><lastmod>([^<]+)</lastmod>', xml)
                  if mod[:10] >= cut and ('/article/' in loc or '/car/' in loc)]
          before = os.environ.get('BEFORE_SHA', '')
          if before:
              try:
                  out = subprocess.run(['git', 'diff', '--name-only', '--diff-filter=D', before, 'HEAD', '--', 'article', 'car'],
                                       capture_output=True, text=True).stdout
                  for f in out.splitlines():
                      if f.endswith('/index.html'):
                          urls.append('https://speedometer10.co.il/' + f[:-len('index.html')])
              except Exception:
                  pass
          print(json.dumps(sorted(set(urls))))
          PYEOF
          )
          if [ "$URLS" = "[]" ] || [ -z "$URLS" ]; then
            echo "אין כתובות חדשות לשליחה."
            exit 0
          fi
          echo "שולח ל-IndexNow: $URLS" | cut -c1-600
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"speedometer10.co.il\",\"key\":\"ebb52cb45b3d9cad4278400cfb17e026\",\"keyLocation\":\"https://speedometer10.co.il/ebb52cb45b3d9cad4278400cfb17e026.txt\",\"urlList\":${URLS}}" \
            -o /tmp/indexnow_response.txt -w "IndexNow response code: %{http_code}\n"
          cat /tmp/indexnow_response.txt || true
