<script src="/car-page.js?v=9"></script>
<script>
/* ═══ ספידומטר — עמוד הדגם (car.html v2, 29.10.2026) ═══
   הנתיב הקנוני: /car/{slug}/ (עמוד סטטי שנבנה ב-generate-static-pages.mjs מאותו car-page.js).
   ?id= ישן מופנה לנתיב החדש. מונה צפיות: increment_car_views עם הגנת sessionStorage. */
(function () {
  'use strict';
  const S = window.SPCars, P = window.SPCarPage, rootEl = document.getElementById('car-page-root');
  document.getElementById('yr').textContent = new Date().getFullYear();
  document.getElementById('hdr-menu').addEventListener('click', function () { const o = document.getElementById('cx-nav').classList.toggle('open'); this.setAttribute('aria-expanded', o); });
  document.addEventListener('click', e => { if (e.target.closest('[data-open-compare]')) { e.preventDefault(); S.openCompare(); } });
  window.addEventListener('scroll', () => document.getElementById('hdr').classList.toggle('is-scrolled', scrollY > 8), { passive: true });

  const m = location.pathname.match(/\/car\/([^/]+)\/?$/);
  let slug = m ? decodeURIComponent(m[1]) : null;
  if (!slug) { const legacy = new URLSearchParams(location.search).get('id'); if (legacy) { location.replace('/car/' + encodeURIComponent(legacy) + '/'); return; } }

  function setMeta(c) {
    const name = (c._brand ? c._brand.name : c.brand) + ' ' + c.model + ' ' + (c.year || '');
    if (document.title === 'טוען...') document.title = c.meta_title || (name.trim() + ' | ספידומטר');
    const set = (sel, attr, val) => { const el = document.querySelector(sel); if (el && !el.getAttribute(attr)) el.setAttribute(attr, val); };
    set('meta[name="description"]', 'content', c.meta_description || (c.description || '').slice(0, 155));
    set('link[rel="canonical"]', 'href', location.origin + '/car/' + c.slug + '/');
    set('meta[property="og:title"]', 'content', document.title);
    set('meta[property="og:url"]', 'content', location.origin + '/car/' + c.slug + '/');
    set('meta[property="og:image"]', 'content', c.image_main || '');
    const bc = document.getElementById('breadcrumb-name'); if (bc) bc.textContent = name.trim();
  }
  function trackView(id) {
    if (id == null) return;
    try { const seen = JSON.parse(sessionStorage.getItem('sp_viewed_cars') || '[]'); if (seen.indexOf(id) !== -1) return; seen.push(id); sessionStorage.setItem('sp_viewed_cars', JSON.stringify(seen)); } catch (e) {}
    fetch('https://kaykrrnmykqrfhawgtqt.supabase.co/rest/v1/rpc/increment_car_views', { method: 'POST', headers: { apikey: 'sb_publishable_Ms6YFTnADm-qAd9617Ey9A_D3x-Zumi', Authorization: 'Bearer sb_publishable_Ms6YFTnADm-qAd9617Ey9A_D3x-Zumi', 'Content-Type': 'application/json' }, body: JSON.stringify({ car_id: id }) }).catch(() => {});
  }
  /* חוות דעת מפורסמת (טבלת car_reviews) — הציבור מקבל רק את העותק המפורסם; אם הטבלה/השורה לא קיימות — null */
  function loadReview(id) {
    if (id == null) return Promise.resolve(null);
    return fetch('https://kaykrrnmykqrfhawgtqt.supabase.co/rest/v1/car_reviews?select=published,published_at,author&published=not.is.null&car_id=eq.' + encodeURIComponent(id), {
      headers: { apikey: 'sb_publishable_Ms6YFTnADm-qAd9617Ey9A_D3x-Zumi', Authorization: 'Bearer sb_publishable_Ms6YFTnADm-qAd9617Ey9A_D3x-Zumi' }
    }).then(r => r.ok ? r.json() : []).then(a => (Array.isArray(a) && a[0]) || null).catch(() => null);
  }
  function showError(msg) {
    rootEl.innerHTML = '<div class="error-state"><h2>' + S.esc(msg) + '</h2><p>ייתכן שהקישור שגוי או שהדגם הוסר מהמאגר.</p><a class="cx-btn cx-btn--dark cx-btn--sm" href="/cars-list.html" style="margin-top:10px">חזרה למאגר הרכבים</a></div>';
  }
  if (!slug) { showError('לא סופק מזהה רכב'); return; }

  S.load().then(res => {
    S.setCars(res.cars);
    const c = res.cars.find(x => String(x.slug || x.id) === slug);
    if (!c) { showError('הדגם לא נמצא במאגר'); return; }
    setMeta(c);
    rootEl.innerHTML = P.render(c);
    P.mount(rootEl, c, { cars: res.cars, loadReview: loadReview });
    S.Compare.sync(); S.renderTray();
    trackView(c.id);
  }).catch(err => { console.error(err); showError('שגיאה בטעינת הנתונים'); });
})();
</script>
